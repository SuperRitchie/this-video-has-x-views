name: Update YouTube Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  update_video:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Run the script
        run: python ./main.py
        env:
          CLIENT_CONFIG_JSON: ${{ secrets.CLIENT_CONFIG_JSON }}
          TOKEN_JSON_BASE64: ${{ secrets.TOKEN_JSON_BASE64 }}
          TOKEN_JSON_OUT_FILE: /tmp/youtube-token.b64

      - name: Save refreshed YouTube token
        if: hashFiles('/tmp/youtube-token.b64') != ''
        run: gh secret set TOKEN_JSON_BASE64 < /tmp/youtube-token.b64
        env:
          GH_TOKEN: ${{ secrets.YOUTUBE_SECRET_PAT }}